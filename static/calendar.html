<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>投資行事曆 | Nova Pattern</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", sans-serif;
            background: #0a0e27;
            color: #e0e6ed;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            padding: 30px 0;
            border-bottom: 1px solid #2a3f5f;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 28px;
            color: #fff;
            margin-bottom: 10px;
        }

        .header-subtitle {
            color: #8899aa;
            font-size: 14px;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 20px;
            margin-bottom: 30px;
        }

        @media (max-width: 900px) {
            .main-grid { grid-template-columns: 1fr; }
        }

        /* 日曆 */
        .calendar-section {
            background: #0f1626;
            border: 1px solid #2a3f5f;
            border-radius: 8px;
            padding: 20px;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .calendar-header h2 {
            font-size: 18px;
        }

        .calendar-nav button {
            background: #1a2949;
            border: 1px solid #3a4f6f;
            color: #e0e6ed;
            padding: 5px 10px;
            margin: 0 5px;
            border-radius: 4px;
            cursor: pointer;
        }

        .calendar-nav button:hover {
            background: #2a3949;
        }

        .calendar-weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
            margin-bottom: 5px;
        }

        .calendar-weekday {
            text-align: center;
            padding: 10px;
            font-weight: 600;
            color: #8899aa;
            font-size: 12px;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
        }

        .calendar-day {
            aspect-ratio: 1;
            background: #1a2949;
            border: 1px solid #2a3f5f;
            padding: 5px;
            text-align: center;
            cursor: pointer;
            border-radius: 4px;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .calendar-day.other-month {
            opacity: 0.3;
        }

        .calendar-day.has-event {
            border-color: #4a9eff;
            background: #0f2a45;
        }

        .calendar-day.today {
            background: #1a3949;
            border-color: #6ab7ff;
        }

        .event-dot {
            width: 3px;
            height: 3px;
            background: #4a9eff;
            border-radius: 50%;
            margin: 0 auto;
        }

        /* 側邊欄 */
        .sidebar {
            background: #0f1626;
            border: 1px solid #2a3f5f;
            border-radius: 8px;
            padding: 20px;
        }

        .sidebar h3 {
            font-size: 14px;
            color: #8899aa;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .event-item {
            background: #1a2949;
            padding: 12px;
            margin-bottom: 10px;
            border-left: 3px solid #4a9eff;
            border-radius: 4px;
            font-size: 12px;
        }

        .event-item.critical { border-left-color: #ff5555; }
        .event-item.high { border-left-color: #ffaa44; }
        .event-item.medium { border-left-color: #4a9eff; }
        .event-item.low { border-left-color: #88aa88; }

        .event-item-date {
            color: #8899aa;
            font-size: 11px;
            margin-bottom: 5px;
        }

        .event-item-name {
            color: #fff;
            font-weight: 600;
            margin-bottom: 3px;
        }

        .event-item-type {
            display: inline-block;
            font-size: 10px;
            background: #2a3949;
            padding: 2px 6px;
            border-radius: 3px;
            color: #8899aa;
            margin-top: 5px;
        }

        /* 新增事件表單 */
        .add-event-section {
            background: #0f1626;
            border: 1px solid #2a3f5f;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .add-event-section h2 {
            font-size: 16px;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            color: #8899aa;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 8px;
            background: #1a2949;
            border: 1px solid #3a4f6f;
            color: #e0e6ed;
            border-radius: 4px;
            font-size: 12px;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #4a9eff;
        }

        .btn-add {
            width: 100%;
            padding: 10px;
            background: #1a5a99;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-add:hover {
            background: #2a6aaa;
        }

        /* 事件列表 */
        .events-section {
            background: #0f1626;
            border: 1px solid #2a3f5f;
            border-radius: 8px;
            padding: 20px;
        }

        .events-section h2 {
            font-size: 16px;
            margin-bottom: 15px;
        }

        .event-list-item {
            background: #1a2949;
            padding: 15px;
            margin-bottom: 10px;
            border-left: 3px solid #4a9eff;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .event-list-item.critical { border-left-color: #ff5555; }
        .event-list-item.high { border-left-color: #ffaa44; }
        .event-list-item.medium { border-left-color: #4a9eff; }

        .event-list-content {
            flex: 1;
        }

        .event-list-date {
            color: #8899aa;
            font-size: 12px;
            margin-bottom: 5px;
        }

        .event-list-name {
            color: #fff;
            font-weight: 600;
            margin-bottom: 3px;
        }

        .event-list-meta {
            font-size: 11px;
            color: #8899aa;
        }

        .btn-delete {
            background: #662222;
            color: #ff8888;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
        }

        .btn-delete:hover {
            background: #993333;
        }

        /* 連結回首頁 */
        .nav-link {
            display: inline-block;
            padding: 8px 16px;
            background: #1a2949;
            color: #4a9eff;
            text-decoration: none;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 13px;
        }

        .nav-link:hover {
            background: #2a3949;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="nav-link">← 回首頁</a>

        <header>
            <h1>📅 投資行事曆</h1>
            <p class="header-subtitle">經濟數據 · 個股事件 · 自訂行程</p>
        </header>

        <div class="add-event-section">
            <h2>新增行程</h2>
            <form id="addEventForm">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div class="form-group">
                        <label>事件名稱</label>
                        <input type="text" id="eventName" placeholder="例：台積電財報" required>
                    </div>
                    <div class="form-group">
                        <label>日期</label>
                        <input type="date" id="eventDate" required>
                    </div>
                    <div class="form-group">
                        <label>時間</label>
                        <input type="time" id="eventTime">
                    </div>
                    <div class="form-group">
                        <label>類型</label>
                        <select id="eventType">
                            <option value="custom">自訂行程</option>
                            <option value="economic">經濟指標</option>
                            <option value="company">個股事件</option>
                        </select>
                    </div>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px;">
                    <div class="form-group">
                        <label>股票代碼 (選填)</label>
                        <input type="text" id="eventSymbol" placeholder="例：2330">
                    </div>
                    <div class="form-group">
                        <label>重要性</label>
                        <select id="eventImportance">
                            <option value="low">低</option>
                            <option value="medium">中</option>
                            <option value="high">高</option>
                            <option value="critical">極高</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn-add">+ 新增事件</button>
            </form>
        </div>

        <div class="main-grid">
            <div class="calendar-section">
                <div class="calendar-header">
                    <h2 id="monthYear"></h2>
                    <div class="calendar-nav">
                        <button id="prevMonth">◀</button>
                        <button id="todayBtn">今天</button>
                        <button id="nextMonth">▶</button>
                    </div>
                </div>

                <div class="calendar-weekdays">
                    <div class="calendar-weekday">日</div>
                    <div class="calendar-weekday">一</div>
                    <div class="calendar-weekday">二</div>
                    <div class="calendar-weekday">三</div>
                    <div class="calendar-weekday">四</div>
                    <div class="calendar-weekday">五</div>
                    <div class="calendar-weekday">六</div>
                </div>

                <div class="calendar-grid" id="calendarGrid"></div>
            </div>

            <div class="sidebar">
                <h3>即將發生</h3>
                <div id="upcomingEvents"></div>
            </div>
        </div>

        <div class="events-section">
            <h2>所有事件</h2>
            <div id="allEventsList"></div>
        </div>
    </div>

    <script>
        let currentDate = new Date();
        let allEvents = {};

        // 初始化
        async function init() {
            await loadEvents();
            renderCalendar();
            renderUpcomingEvents();
            renderAllEvents();
        }

        async function loadEvents() {
            try {
                const response = await fetch('/api/events');
                allEvents = await response.json();
            } catch (e) {
                console.error('載入事件失敗:', e);
                allEvents = { economic: [], company: [], custom: [] };
            }
        }

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            // 月份標題
            const monthNames = ['一月', '二月', '三月', '四月', '五月', '六月',
                              '七月', '八月', '九月', '十月', '十一月', '十二月'];
            document.getElementById('monthYear').textContent = `${year} 年 ${monthNames[month]}`;

            // 計算第一天和最後一天
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const prevLastDay = new Date(year, month, 0).getDate();

            let dayNum = 1;
            let nextDayNum = 1;
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';

            // 取得該月所有事件日期
            const eventDates = new Set();
            for (const category in allEvents) {
                if (Array.isArray(allEvents[category])) {
                    allEvents[category].forEach(e => {
                        const eDate = e.date;
                        const [eYear, eMonth, eDay] = eDate.split('-');
                        if (parseInt(eYear) === year && parseInt(eMonth) === month + 1) {
                            eventDates.add(eDate);
                        }
                    });
                }
            }

            // 上個月的日期
            for (let i = firstDay.getDay(); i > 0; i--) {
                const cell = document.createElement('div');
                cell.className = 'calendar-day other-month';
                cell.textContent = prevLastDay - i + 1;
                grid.appendChild(cell);
            }

            // 當月日期
            const today = new Date();
            for (dayNum = 1; dayNum <= lastDay.getDate(); dayNum++) {
                const cell = document.createElement('div');
                cell.className = 'calendar-day';

                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(dayNum).padStart(2, '0')}`;
                if (eventDates.has(dateStr)) {
                    cell.classList.add('has-event');
                    const dot = document.createElement('div');
                    dot.className = 'event-dot';
                    cell.appendChild(dot);
                }

                // 標記今天
                if (year === today.getFullYear() && month === today.getMonth() && dayNum === today.getDate()) {
                    cell.classList.add('today');
                }

                cell.appendChild(document.createTextNode(dayNum));
                grid.appendChild(cell);
            }

            // 下個月的日期
            const totalCells = grid.children.length;
            const remainingCells = 42 - totalCells; // 6 rows × 7 days
            for (nextDayNum = 1; nextDayNum <= remainingCells; nextDayNum++) {
                const cell = document.createElement('div');
                cell.className = 'calendar-day other-month';
                cell.textContent = nextDayNum;
                grid.appendChild(cell);
            }
        }

        function renderUpcomingEvents() {
            const container = document.getElementById('upcomingEvents');
            container.innerHTML = '';

            const upcoming = [];
            const today = new Date().toISOString().split('T')[0];

            for (const category in allEvents) {
                if (Array.isArray(allEvents[category])) {
                    allEvents[category].forEach(e => {
                        if (e.date >= today) {
                            upcoming.push(e);
                        }
                    });
                }
            }

            upcoming.sort((a, b) => a.date.localeCompare(b.date));
            upcoming.slice(0, 5).forEach(e => {
                const div = document.createElement('div');
                div.className = `event-item ${e.importance || 'medium'}`;
                const dateStr = new Date(e.date).toLocaleDateString('zh-TW');
                div.innerHTML = `
                    <div class="event-item-date">${dateStr} ${e.time || ''}</div>
                    <div class="event-item-name">${e.name}</div>
                    <div class="event-item-type">${getCategoryLabel(e.type)}</div>
                `;
                container.appendChild(div);
            });
        }

        function renderAllEvents() {
            const container = document.getElementById('allEventsList');
            container.innerHTML = '';

            const allEventsList = [];
            for (const category in allEvents) {
                if (Array.isArray(allEvents[category])) {
                    allEvents[category].forEach(e => {
                        allEventsList.push(e);
                    });
                }
            }

            allEventsList.sort((a, b) => a.date.localeCompare(b.date));

            if (allEventsList.length === 0) {
                container.innerHTML = '<p style="color: #8899aa;">尚無事件</p>';
                return;
            }

            allEventsList.forEach(e => {
                const div = document.createElement('div');
                div.className = `event-list-item ${e.importance || 'medium'}`;
                const dateStr = new Date(e.date).toLocaleDateString('zh-TW');
                div.innerHTML = `
                    <div class="event-list-content">
                        <div class="event-list-date">${dateStr} ${e.time || '不詳'}</div>
                        <div class="event-list-name">${e.name}</div>
                        <div class="event-list-meta">${getCategoryLabel(e.type)} ${e.symbol ? '(' + e.symbol + ')' : ''}</div>
                    </div>
                    <button class="btn-delete" onclick="deleteEvent(${e.id})">刪除</button>
                `;
                container.appendChild(div);
            });
        }

        function getCategoryLabel(type) {
            const labels = { economic: '📊 經濟', company: '📈 個股', custom: '📌 自訂' };
            return labels[type] || '事件';
        }

        // 事件監聽器
        document.getElementById('prevMonth').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar();
        });

        document.getElementById('nextMonth').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar();
        });

        document.getElementById('todayBtn').addEventListener('click', () => {
            currentDate = new Date();
            renderCalendar();
            renderUpcomingEvents();
        });

        document.getElementById('addEventForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const event = {
                name: document.getElementById('eventName').value,
                date: document.getElementById('eventDate').value,
                time: document.getElementById('eventTime').value,
                type: document.getElementById('eventType').value,
                symbol: document.getElementById('eventSymbol').value || null,
                importance: document.getElementById('eventImportance').value
            };

            try {
                const response = await fetch('/api/events', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(event)
                });

                if (response.ok) {
                    document.getElementById('addEventForm').reset();
                    await loadEvents();
                    renderCalendar();
                    renderUpcomingEvents();
                    renderAllEvents();
                    alert('✅ 事件已新增');
                }
            } catch (e) {
                alert('❌ 新增失敗: ' + e.message);
            }
        });

        async function deleteEvent(id) {
            if (!confirm('確定刪除？')) return;
            try {
                const response = await fetch(`/api/events/${id}`, { method: 'DELETE' });
                if (response.ok) {
                    await loadEvents();
                    renderCalendar();
                    renderUpcomingEvents();
                    renderAllEvents();
                }
            } catch (e) {
                alert('❌ 刪除失敗: ' + e.message);
            }
        }

        // 啟動
        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", init);
        } else {
            init();
        }
    </script>
</body>
</html>
